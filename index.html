<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Celixia Linktree</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 🎥 Video background */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Dark overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1;
        }

        /* ----- BOXES ----- */
        .bottom-boxes {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 0 20px;
            z-index: 3;
        }

        .box {
            width: 350px;
            height: 95px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(6px);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box a {
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        /* ----- 📱 MOBILE FIX ----- */
        @media (max-width: 768px) {

            body {
                overflow-y: auto;
            }

            .bottom-boxes {
                flex-direction: column;
                bottom: 40px;
                gap: 25px;
                padding: 0 10px;
                align-items: center;
            }

            .box {
                width: 95%;
                max-width: 420px;
                height: 80px;
            }

            .box a {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Video -->
    <video autoplay muted playsinline class="video-bg">
        <source src="https://res.cloudinary.com/dk2vcuazz/video/upload/v1763503219/Vid%C3%A9o_sans_titre_balmso.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <!-- Boxes perfectly aligned -->
    <div class="bottom-boxes">
        <div class="box">
            <a href="https://www.celixia.shop">Watchs</a>
        </div>

        <div class="box">
            <a href="https://www.celixia.info">Smoker Accessories</a>
        </div>

        <div class="box">
            <a href="https://www.celixia.online">Clothing</a>
        </div>
    </div>

</body>
</html>
