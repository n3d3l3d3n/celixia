<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celixia Linktree</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 🎥 Video background */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Dark overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1;
        }

        /* 🔥 NEW: Proper aligned boxes container */
        .bottom-boxes {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 40px; /* fixed spacing */
            z-index: 3;
        }

        .box {
            width: 350px;
            height: 95px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(4px);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box a {
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .bottom-boxes {
                flex-direction: column;
                bottom: 80px;
                gap: 20px;
            }
            .box {
                width: 90%;
                height: 80px;
            }
        }
    </style>
</head>

<body>

    <!-- Video -->
    <video autoplay muted playsinline class="video-bg">
        <source src="https://res.cloudinary.com/dk2vcuazz/video/upload/v1763501750/Create_landing_linktree_202511181634_e6k9nm.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <!-- Boxes perfectly aligned -->
    <div class="bottom-boxes">
        <div class="box">
            <a href="https://www.celixia.shop">Watchs</a>
        </div>

        <div class="box">
            <a href="https://www.celixia.info">Smoker Accessories</a>
        </div>

        <div class="box">
            <a href="https://www.celixia.online">Contact</a>
        </div>
    </div>

</body>
</html>
