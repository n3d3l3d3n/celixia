<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celixia Linktree</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* 🎥 Vidéo en background */
        .video-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            filter: contrast(1.25) brightness(0.85) saturate(1.15) blur(0.3px);
        }

        /* 🖤 Overlay pour lisibilité */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1;
            pointer-events: none;
        }

        /* Conteneur des liens */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(21, 92, 108, 0.70);
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            text-align: center;
            margin-top: 65vh;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        h1 {
            color: #ffffff;
            margin: 10px 0;
            font-size: 26px;
        }

        p {
            color: #ffffff;
            margin-bottom: 20px;
        }

        a.link {
            display: block;
            background: rgba(255,255,255,0.15);
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 12px;
            transition: background 0.3s, transform 0.2s;
            font-weight: bold;
        }

        a.link:hover {
            background: rgba(255,255,255,0.35);
            transform: scale(1.05);
        }

        /* Responsive mobile */
        @media (max-width: 480px) {
            .container {
                margin-top: 50vh;
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            a.link {
                padding: 10px 15px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Vidéo background -->
    <video autoplay muted loop playsinline class="video-bg">
        <source src="https://www.w3schools.com/howto/rain.mp4" type="video/mp4">
        Votre navigateur ne supporte pas la vidéo.
    </video>

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Conteneur central -->
    <div class="container">
        <h1>Celixia</h1>
        <p>Welcome to Celixia Stores</p>
        <a href="https://www.celixia.shop" class="link">Watchs</a>
        <a href="https://www.celixia.shop" class="link">Accessories</a>
        <a href="https://www.celixia.shop" class="link">Contact</a>
    </div>
</body>
</html>
