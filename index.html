<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celixia Linktree</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
            overflow: hidden;
        }
   /* 🎥 Vidéo en background améliorée */
    .video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;

        /* 🔥 Amélioration visuelle */
        filter:
            contrast(1.35)
            brightness(0.90)
            saturate(1.25)
            sharpen(0.7)
            blur(0.7px);
    }

    /* 🖤 Overlay pour lisibilité et cacher les défauts */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.35);
        z-index: -1;
    }
        /* Conteneur des liens */
        .container {
            background: rgba(21, 92, 108, 0.65); /* semi-transparent */
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            text-align: center;
            margin: 0 auto;
            margin-top: 60px;
        }

        h1 {
            color: #ffffff;
            margin: 10px 0;
            font-size: 26px;
        }

        p {
            color: #ffffff;
            margin-bottom: 25px;
        }

        .link {
            display: block;
            padding: 14px 20px;
            margin: 10px 0;
            background:#155c6c;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            transition: 0.2s;
        }

        .link:hover {
            background: #ffffff;
            color: #155c6c;
        }
    </style>
</head>
<body>

    <!-- 🎥 Video Background -->
    <video class="video-bg" autoplay loop muted playsinline>
        <source src="https://streamable.com/p8o79t" type="video/mp4">
    </video>

    <div class="container">
        <h1>Celixia</h1>
        <p>Welcome To Celixia Stores.</p>

        <a href="https://www.celixia.shop" class="link">Watchs</a>
        <a href="https://www.celixia.info" class="link">Smoke accessories</a>
        <a href="https://www.celixia.online" class="link">Clothing store</a>
    </div>

</body>
</html>
