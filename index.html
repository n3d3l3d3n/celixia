<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celixia Linktree</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🎥 Video background */
        .video-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            filter: contrast(1.2) brightness(0.85) saturate(1.1);
        }

        /* Semi-transparent overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1;
            pointer-events: none;
        }

        /* Cadres gris du bas */
        .bottom-boxes {
            position: fixed;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 3;
        }

        .box {
            width: 30%;
            max-width: 450px;
            height: 100px;
            background: rgba(255,255,255,0.12);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .box a {
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .bottom-boxes {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            .box {
                width: 90%;
                height: 80px;
            }
        }
    </style>
</head>

<body>

    <!-- 🎥 Video background (plays once, no loop) -->
    <video autoplay muted playsinline class="video-bg">
        <source src="https://res.cloudinary.com/dk2vcuazz/video/upload/v1763501750/Create_landing_linktree_202511181634_e6k9nm.mp4" type="video/mp4">
    </video>

    <!-- Dark overlay -->
    <div class="overlay"></div>

    <!-- Three bottom boxes with text + links -->
    <div class="bottom-boxes">
        <div class="box">
            <a href="https://www.celixia.shop">Watchs</a>
        </div>
        <div class="box">
            <a href="https://www.celixia.info">Smoker Accessories</a>
        </div>
        <div class="box">
            <a href="https://www.celixia.online">Contact</a>
        </div>
    </div>

</body>
</html>
