<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celixia Linktree</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* 🎥 Vidéo en background améliorée */
        .video-bg {
            position: fixed;
            inset: 0; /* top:0; right:0; bottom:0; left:0; */
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            /* Amélioration visuelle (supporté partout) */
            filter: contrast(1.25) brightness(0.85) saturate(1.15) blur(0.3px);
        }

        /* 🖤 Overlay pour lisibilité et cacher les défauts */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1;
            pointer-events: none;
        }

        /* Conteneur des liens */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(21, 92, 108, 0.70); /* semi-transparent */
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            text-align: center;

            /* placé sous la moitié de la page */
            margin-top: 65vh;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

            color: #ffffff;
            margin: 10px 0;
            font-size: 26px;
        }
